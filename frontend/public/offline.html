<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — UK Golf Knockout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { text-align: center; max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #15803d; font-size: 24px; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
    button { background: #15803d; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #166534; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⛳</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your connection. Check your signal and try again — your scores will sync automatically when you're back online.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
